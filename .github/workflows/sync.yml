name: LeetCode Auto Sync

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:       # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LeetCode Submissions
        uses: kawarimidoll/leetcode-submissions@v1
        with:
          username: abirmehmed
          output_dir: ./solutions

      - name: Commit and Push
        run: |
          git config user.name "abirmehmed"
          git config user.email "abirmehmed@users.noreply.github.com"
          git add .
          git commit -m "Auto-sync LeetCode solutions" || exit 0
          git push
